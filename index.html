<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danielle Lincoln — Interior Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f7f4ef;
    --overlay-top: rgba(22, 18, 14, 0.4);
    --overlay-bottom: rgba(18, 14, 11, 0.8);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .hero {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(to bottom, var(--overlay-top) 0%, var(--overlay-bottom) 100%),
      url('hero.jpg');
    background-size: cover;
    background-position: 55% 55%;
    background-repeat: no-repeat;
    transform: scale(1.15);
    transform-origin: 85% 55%;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brand {
    padding: 2rem clamp(1.5rem, 5vw, 3.5rem) 0;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem clamp(1.25rem, 6vw, 4rem);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.25rem, 6vw, 4.5rem);
    line-height: 1.12;
    max-width: 18ch;
  }

  .subhead {
    margin-top: 1.75rem;
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(1.05rem, 2.2vw, 1.4rem);
    max-width: 40ch;
    opacity: 0.95;
  }

  .contact-line {
    padding: 0 1.5rem 2.5rem;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    opacity: 0.9;
  }

  .contact-line a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div class="brand">Danielle Lincoln</div>

      <div class="content">
        <h1>Dedicated to creating thoughtful and inspired spaces.</h1>
      </div>

      <p class="contact-line">
        Contact us at <a href="mailto:hello@daniellelincoln.com">hello@daniellelincoln.com</a>
      </p>
    </div>
  </div>

</body>
</html>
